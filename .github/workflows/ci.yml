name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install (tolerate pnpm's non-fatal ignored-builds notice)
        run: |
          set +e
          pnpm install --frozen-lockfile >/tmp/pnpm-err.log 2>&1
          code=$?
          cat /tmp/pnpm-err.log
          if [ $code -ne 0 ]; then
            if grep -q ERR_PNPM_IGNORED_BUILDS /tmp/pnpm-err.log; then
              echo "Ignored optional builds (esbuild/sharp) ship prebuilt platform binaries; continuing."
            else
              exit $code
            fi
          fi
      - name: Typecheck config/domain/chain
        run: |
          for p in config domain chain ai db; do (cd packages/$p && ../../node_modules/.bin/tsc --noEmit); done
          (cd apps/mcp && ../../node_modules/.bin/tsc --noEmit)
          (cd apps/indexer && ../../node_modules/.bin/tsc --noEmit)
      - name: Domain + AI tests
        run: |
          (cd packages/domain && ../../node_modules/.bin/vitest run)
          (cd packages/ai && ../../node_modules/.bin/vitest run)
      - name: Web build
        run: cd apps/web && ./node_modules/.bin/next build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Foundry tests
        run: cd packages/contracts && forge test -vv
