packages:
  - "packages/*"
  - "apps/*"

# esbuild (vitest/tsx) needs its native binary built.
onlyBuiltDependencies:
  - esbuild

# sharp is an optional Next.js image dependency; skip its build (Next falls back).
# Acknowledged here so `pnpm install --frozen-lockfile` does not error in CI.
ignoredBuiltDependencies:
  - sharp
